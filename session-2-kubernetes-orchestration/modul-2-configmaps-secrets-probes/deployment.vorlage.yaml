apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: __TODO_IMAGE_NAME__:__TODO_TAG__
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: API_TOKEN
          # TODO: startupProbe, readinessProbe und livenessProbe ergänzen,
          # jeweils gegen /health bzw. /ready (siehe Modul-README).
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: __TODO_PERIOD_SECONDS__ # z. B. 5
            failureThreshold: __TODO_FAILURE_THRESHOLD__ # z. B. 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: __TODO_PERIOD_SECONDS__ # z. B. 10
            failureThreshold: __TODO_FAILURE_THRESHOLD__ # z. B. 3
